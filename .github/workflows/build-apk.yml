name: APK 만들기

on:
  workflow_dispatch:   # Actions 탭에서 "Run workflow" 버튼으로 실행
  push:
    branches: [main, master]

permissions:
  contents: write   # 릴리스(다운로드 페이지)를 만들기 위해 필요해요

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 패키지 설치
        run: npm install

      - name: 웹 파일 빌드 (SCSS, SVG)
        run: npm run build:web

      - name: 안드로이드 프로젝트 만들기
        run: |
          npx cap add android
          npx cap sync android

      - name: 실행 방식 설정 바꾸기 (최근 앱 목록 복귀 문제 시험)
        run: |
          sed -i 's/android:launchMode="singleTask"/android:launchMode="singleTop"/' android/app/src/main/AndroidManifest.xml
          grep -n launchMode android/app/src/main/AndroidManifest.xml

      - name: 앱 버전 번호 맞추기 (업데이트 설치가 되려면 매번 숫자가 커져야 해요)
        run: |
          VER=$(node -p "require('./package.json').version")
          # 설치용 번호 = 버전(1.3.10 → 10310) × 1000 + 빌드 횟수. 버전을 올리면 항상 더 큰 번호가 돼요.
          CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); ((a*10000+b*100+c)*1000 + (${{ github.run_number }} % 1000))")
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: 앱 아이콘 적용 (images/app-icon.png 가 있을 때만)
        if: hashFiles('images/app-icon.png') != ''
        run: |
          node scripts/make-icons.js
          npx @capacitor/assets generate --android --iconBackgroundColor "$(cat assets/bg-color.txt)"

      - name: 고정 서명 키 적용 (Secrets 에 DEBUG_KEYSTORE_BASE64 를 넣었을 때만)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > android/ci-debug.keystore
            keytool -list -v -keystore android/ci-debug.keystore -storepass android | grep "SHA256"
            KS=$(keytool -list -v -keystore android/ci-debug.keystore -storepass android | grep "SHA256" | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
            echo "KS_SHA=$KS" >> "$GITHUB_ENV"
            # 빌드가 이 키를 확실히 쓰도록 서명 설정을 직접 적어 넣어요
            cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file('ci-debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF
            echo "고정 서명 키를 적용했어요."
          else
            echo "서명 키 설정이 없어서 매번 새 키로 서명해요."
          fi

      - name: APK 빌드
        working-directory: android
        run: ./gradlew assembleDebug

      - name: 서명 확인 (어떤 키로 서명됐는지 지문을 기록해요)
        id: sig
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA-256" | head -1 | awk '{print $NF}')
          echo "서명 지문(SHA-256): $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$KS_SHA" ] && [ "$SHA" != "$KS_SHA" ]; then
            echo "::error::APK 서명 지문($SHA)이 고정 키($KS_SHA)와 달라요. 서명 키 설정을 확인해야 해요."
            exit 1
          fi

      - name: 버전 확인
        id: ver
        run: |
          echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "checklist-v$(node -p "require('./package.json').version").apk"

      - uses: actions/upload-artifact@v4
        with:
          name: checklist-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 다운로드 페이지(릴리스) 만들기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: 체크리스트 v${{ steps.ver.outputs.v }}
          files: checklist-v${{ steps.ver.outputs.v }}.apk
          overwrite_files: true
          body: "서명 지문(SHA-256): ${{ steps.sig.outputs.sha }}"
