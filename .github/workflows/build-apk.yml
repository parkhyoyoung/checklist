name: APK 만들기

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 패키지 설치
        run: npm install

      - name: 웹 파일 빌드
        run: npm run build:web

      - name: 안드로이드 프로젝트 만들기
        run: |
          npx cap add android
          npx cap sync android

      -          - name: 앱 아이콘 적용 (images/app-icon.png 가 있을 때만)
           if: hashFiles('images/app-icon.png') != ''
           run: |
             node scripts/make-icons.js
             npx @capacitor/assets generate --android --iconBackgroundColor "$(cat assets/bg-color.txt)"

      - name: APK 빌드
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: checklist-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
